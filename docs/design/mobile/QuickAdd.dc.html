<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quick add a task</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B01A31}a:hover{color:#8C1427}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #171717; font-family: Inter, system-ui, sans-serif">
<a href="Main.dc.html" aria-label="Close quick add" style="flex-grow: 1; background: rgba(23,23,23,0.45)"></a>
<div style="display: flex; flex-direction: column; gap: 16px; padding: 20px 20px 28px; background: #FFFFFF">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; font-weight: 500; color: #5C5C5C">New task</span>
<div style="box-sizing: border-box; padding: 12px 14px; border: 1px solid #171717; border-radius: 12px; font-size: 17px; line-height: 32px">Pay rent <span style="padding: 3px 6px; border-radius: 6px; background: #F6F5F2">every 1st at 9:00</span> <span style="padding: 3px 6px; border-radius: 6px; background: #FCEBEE; color: #8C1427; font-weight: 600">p1</span> <span style="padding: 3px 6px; border-radius: 6px; background: #F6F5F2; white-space: nowrap"><span aria-hidden="true" style="display: inline-block; width: 9px; height: 9px; margin-right: 5px; border-radius: 3px; background: #D4213D"></span>#Home</span> <span style="padding: 3px 6px; border-radius: 6px; background: #EEF6F1; color: #1B6943; font-weight: 500">@money</span></div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.4px; color: #5C5C5C">UNDERSTOOD AS</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<span style="display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 10px; background: #F6F5F2; font-size: 14px"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0114-5.3L20 9M20 4v5h-5M20 12a8 8 0 01-14 5.3L4 15M4 20v-5h5"></path></svg>Every month on the 1st</span>
<span style="padding: 8px 12px; border-radius: 10px; background: #F6F5F2; font-size: 14px">09:00</span>
<span style="padding: 8px 12px; border-radius: 10px; background: #FCEBEE; font-size: 14px; font-weight: 600; color: #8C1427">Priority 1</span>
<span style="display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 10px; background: #F6F5F2; font-size: 14px"><span aria-hidden="true" style="width: 9px; height: 9px; border-radius: 3px; background: #D4213D"></span>Home</span>
<span style="padding: 8px 12px; border-radius: 10px; background: #EEF6F1; font-size: 14px; font-weight: 500; color: #1B6943">@money</span>
</div>
</div>
<div style="display: flex; align-items: center; gap: 8px">
<sc-for list="{{actions}}" as="a" hint-placeholder-count="4">
<button type="button" aria-label="{{a.label}}" style="width: 48px; height: 48px; border: 1px solid #D9D6D0; border-radius: 12px; background: #FFFFFF; color: #171717; display: flex; align-items: center; justify-content: center; padding: 0">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{a.d}}"></path></svg>
</button>
</sc-for>
<a href="Main.dc.html" style="margin-left: auto; height: 48px; padding: 0 20px; border-radius: 12px; background: #D4213D; color: #FFFFFF; font-size: 15px; font-weight: 600; text-decoration: none; display: flex; align-items: center">Add task</a>
</div>
<span style="font-size: 13px; line-height: 20px; color: #5C5C5C">Type it the way you say it: dates, p1 to p4, #project, @label.</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var actions = [
['Set date', 'M6 5h12a2 2 0 012 2v11a2 2 0 01-2 2H6a2 2 0 01-2-2V7a2 2 0 012-2z M4 10h16 M9 3v4 M15 3v4'],
['Set priority', 'M5 21V4 M5 4h13l-3 4.5 3 4.5H5'],
['Add label', 'M4 4h8l8 8-8 8-8-8z M8.5 8.5v.01'],
['Add reminder', 'M6 17V11a6 6 0 0112 0v6l2 2H4z M10 21h4']
].map(function (a) { return { label: a[0], d: a[1] }; });
return { actions: actions };
}
}
</script>
</body>
</html>
