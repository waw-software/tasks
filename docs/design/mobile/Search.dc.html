<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Search and filter tasks</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B01A31}a:hover{color:#8C1427}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 0 20px; display: flex; flex-direction: column; background: #FFFFFF; color: #171717; font-family: Inter, system-ui, sans-serif">
<div style="display: flex; flex-direction: column; gap: 12px; padding: 0 20px 12px">
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 30px; letter-spacing: -0.4px">Search</h1>
<div style="display: flex; align-items: center; gap: 10px; height: 50px; box-sizing: border-box; padding: 0 14px; border: 1px solid #171717; border-radius: 12px">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
<label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%)">Search tasks</label>
<input id="q" type="search" value="rent" style="flex-grow: 1; min-width: 0; height: 46px; border: none; background: transparent; font-family: inherit; font-size: 16px; color: #171717">
</div>
<div style="display: flex; gap: 8px; overflow-x: auto; margin: 0 -20px; padding: 0 20px">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
<button type="button" aria-pressed="{{c.pressed}}" style="flex-shrink: 0; height: 44px; padding: 0 14px; border: 1px solid {{c.line}}; border-radius: 999px; background: {{c.bg}}; color: {{c.ink}}; font-family: inherit; font-size: 14px; font-weight: 500">{{c.label}}</button>
</sc-for>
</div>
</div>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px; padding: 0 20px 0 8px; overflow: hidden">
<span style="padding-left: 12px; font-size: 12px; font-weight: 600; letter-spacing: 0.4px; color: #5C5C5C">2 OPEN TASKS</span>
<sc-for list="{{results}}" as="t" hint-placeholder-count="2">
<div style="display: flex; align-items: flex-start; border-bottom: 1px solid #EEECE8">
<label style="width: 44px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center"><input type="checkbox" aria-label="{{t.title}}" style="width: 22px; height: 22px; accent-color: #171717"></label>
<a href="Task.dc.html" style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0; padding: 10px 0; text-decoration: none; color: #171717">
<span style="font-size: 16px; line-height: 22px">{{t.title}}</span>
<span style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-size: 13px; color: #5C5C5C"><span><span style="font-weight: 600; color: {{t.pInk}}">{{t.p}}</span><span>{{t.meta}}</span></span><sc-for list="{{t.labels}}" as="l" hint-placeholder-count="1"><span style="padding: 2px 8px; border-radius: 6px; background: {{l.bg}}; color: {{l.ink}}; font-weight: 500">{{l.name}}</span></sc-for><span style="margin-left: auto; display: flex; align-items: center; gap: 6px"><span>{{t.proj}}</span><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 3px; background: {{t.projColor}}"></span></span></span>
</a>
</div>
</sc-for>
<span style="padding: 14px 0 0 12px; font-size: 12px; font-weight: 600; letter-spacing: 0.4px; color: #5C5C5C">COMPLETED</span>
<div style="display: flex; align-items: flex-start; border-bottom: 1px solid #EEECE8">
<label style="width: 44px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center"><input type="checkbox" checked aria-label="Pay rent, done in October" style="width: 22px; height: 22px; accent-color: #171717"></label>
<div style="display: flex; flex-direction: column; gap: 3px; padding: 10px 0">
<span style="font-size: 16px; line-height: 22px; color: #5C5C5C; text-decoration: line-through">Pay rent</span>
<span style="font-size: 13px; color: #5C5C5C">Done on 1 Oct · Home</span>
</div>
</div>
<div style="margin: 16px 0 0 12px; display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 12px; background: #F6F5F2">
<span style="font-size: 14px; line-height: 21px; color: #3D3D3D">Search often for the same thing? Save it as a filter and it shows up in Browse.</span>
<button type="button" style="align-self: flex-start; height: 44px; padding: 0 16px; border: 1px solid #171717; border-radius: 10px; background: #FFFFFF; color: #171717; font-family: inherit; font-size: 14px; font-weight: 600">Save as filter</button>
</div>
</div>
<nav aria-label="Main" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 6px 12px 0; border-top: 1px solid #EEECE8">
<sc-for list="{{tabs}}" as="tab" hint-placeholder-count="4">
<a href="{{tab.href}}" style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: {{tab.ink}}; font-size: 11px; font-weight: {{tab.weight}}">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{tab.d}}"></path></svg>
<span>{{tab.label}}</span>
</a>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var inks = { 1: '#B01A31', 2: '#8A5A00', 3: '#1F5FBF' };
var projects = { Home: '#D4213D', Work: '#1F5FBF', Personal: '#1F7A4D' };
var labelStyles = { money: ['#EEF6F1', '#1B6943'], calls: ['#EAF1FB', '#1F5FBF'], waiting: ['#FBF3E2', '#8A5A00'], errands: ['#F0ECFA', '#5B3FB5'] };
function task(title, pr, meta, proj, labels) {
return { title: title, p: pr < 4 ? 'P' + pr + (meta ? ' · ' : '') : '', pInk: inks[pr] || '#5C5C5C', meta: meta, proj: proj || '', projColor: proj ? projects[proj] : 'transparent', labels: (labels || []).map(function (n) { return { name: '@' + n, bg: labelStyles[n][0], ink: labelStyles[n][1] }; }) };
}
var tabs = [
['Today', 'Main.dc.html', 'M6 5h12a2 2 0 012 2v11a2 2 0 01-2 2H6a2 2 0 01-2-2V7a2 2 0 012-2z M4 10h16 M9 3v4 M15 3v4'],
['Upcoming', 'Upcoming.dc.html', 'M4 7h16 M4 12h16 M4 17h9'],
['Search', 'Search.dc.html', 'M11 4a7 7 0 100 14 7 7 0 000-14z M20 20l-4-4'],
['Browse', 'Browse.dc.html', 'M4 5h7v7H4z M13 5h7v7h-7z M4 14h7v5H4z M13 14h7v5h-7z']
].map(function (t) {
var on = t[0] === 'Search';
return { label: t[0], href: t[1], d: t[2], ink: on ? '#D4213D' : '#5C5C5C', weight: on ? 600 : 500 };
});
var chips = ['Project: Home', 'Priority', 'Label', 'Date'].map(function (label, i) {
var on = i === 0;
return { label: label, pressed: on ? 'true' : 'false', line: on ? '#171717' : '#D9D6D0', bg: on ? '#171717' : '#FFFFFF', ink: on ? '#FFFFFF' : '#171717' };
});
return {
tabs: tabs,
chips: chips,
results: [task('Pay rent', 1, 'Today 09:00 · repeats monthly', 'Home', ['money']), task('Renew the rental insurance', 3, 'Thu 10 Dec', 'Home', ['money'])]
};
}
}
</script>
</body>
</html>
