<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Edit project</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B01A31}a:hover{color:#8C1427}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 20px 28px; display: flex; flex-direction: column; gap: 18px; background: #FFFFFF; color: #171717; font-family: Inter, system-ui, sans-serif">
<div style="display: flex; align-items: center; gap: 6px; margin-left: -8px">
<a href="Project.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #171717">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<h1 style="margin: 0; flex-grow: 1; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 24px; letter-spacing: -0.3px">Edit project</h1>
<a href="Project.dc.html" style="height: 44px; padding: 0 18px; border-radius: 12px; background: #D4213D; color: #FFFFFF; font-size: 15px; font-weight: 600; text-decoration: none; display: flex; align-items: center">Save</a>
</div>
<div style="display: flex; align-items: center; gap: 12px; padding: 16px; border-radius: 14px; background: #F6F5F2">
<span aria-hidden="true" style="width: 18px; height: 18px; border-radius: 6px; background: {{previewColor}}"></span>
<span style="font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 600">Home</span>
<span style="margin-left: auto; font-size: 14px; color: #5C5C5C">5 tasks</span>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="p-name" style="font-size: 13px; font-weight: 500; color: #5C5C5C">Name</label>
<input id="p-name" type="text" value="Home" style="height: 50px; box-sizing: border-box; padding: 0 16px; border: 1px solid #D9D6D0; border-radius: 12px; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #171717">
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 13px; font-weight: 500; color: #5C5C5C">Color</span>
<div style="display: flex; align-items: center; gap: 10px">
<sc-for list="{{colors}}" as="c" hint-placeholder-count="6">
<button type="button" aria-label="{{c.label}}" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="width: 44px; height: 44px; border: none; border-radius: 50%; background: {{c.hex}}; box-shadow: {{c.ring}}; padding: 0"></button>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="p-parent" style="font-size: 13px; font-weight: 500; color: #5C5C5C">Inside another project</label>
<select id="p-parent" style="height: 50px; box-sizing: border-box; padding: 0 12px; border: 1px solid #D9D6D0; border-radius: 12px; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #171717">
<option>None, top level</option>
<option>Work</option>
<option>Personal</option>
</select>
</div>
<div style="display: flex; align-items: center; gap: 12px; min-height: 48px">
<input id="p-fav" type="checkbox" checked style="width: 24px; height: 24px; flex-shrink: 0; accent-color: #171717">
<label for="p-fav" style="font-size: 15px; flex-grow: 1; padding: 12px 0">Pin to the top of Browse</label>
</div>
<div style="margin-top: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<button type="button" style="height: 50px; border: 1px solid #D9D6D0; border-radius: 12px; background: #FFFFFF; color: #171717; font-family: inherit; font-size: 15px; font-weight: 500">Archive</button>
<button type="button" style="height: 50px; border: 1px solid #D9D6D0; border-radius: 12px; background: #FFFFFF; color: #B01A31; font-family: inherit; font-size: 15px; font-weight: 600">Delete project</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var self = this;
var sel = (this.state && this.state.color) || 0;
var data = [['Red', '#D4213D'], ['Blue', '#1F5FBF'], ['Green', '#1F7A4D'], ['Amber', '#8A5A00'], ['Violet', '#5B3FB5'], ['Black', '#171717']];
var colors = data.map(function (it, i) {
return { label: it[0], hex: it[1], pressed: i === sel ? 'true' : 'false', ring: i === sel ? '0 0 0 2px #FFFFFF, 0 0 0 4px #171717' : 'none', pick: function () { self.setState({ color: i }); } };
});
return { colors: colors, previewColor: data[sel][1] };
}
}
</script>
</body>
</html>
