<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pick a due date</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B01A31}a:hover{color:#8C1427}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #171717; font-family: Inter, system-ui, sans-serif">
<a href="Task.dc.html" aria-label="Close date picker" style="flex-grow: 1; background: rgba(23,23,23,0.45)"></a>
<div style="display: flex; flex-direction: column; gap: 14px; padding: 20px 20px 28px; background: #FFFFFF">
<div style="display: flex; align-items: center; justify-content: space-between">
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 22px; letter-spacing: -0.2px">Due date</h1>
<button type="button" style="height: 44px; padding: 0 4px; border: none; background: transparent; color: #5C5C5C; font-family: inherit; font-size: 15px; font-weight: 500">No date</button>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{quick}}" as="q" hint-placeholder-count="4">
<button type="button" aria-pressed="{{q.pressed}}" style="height: 48px; padding: 0 12px; border: 1px solid {{q.line}}; border-radius: 12px; background: {{q.bg}}; color: {{q.ink}}; font-family: inherit; font-size: 14px; font-weight: 500; display: flex; align-items: center; justify-content: space-between">
<span>{{q.label}}</span><span style="opacity: 0.75">{{q.day}}</span>
</button>
</sc-for>
</div>
<div style="display: flex; align-items: center; justify-content: space-between">
<span style="font-size: 16px; font-weight: 600">November 2026</span>
<div style="display: flex; gap: 4px">
<button type="button" aria-label="Previous month" style="width: 44px; height: 44px; border: none; background: transparent; color: #171717; display: flex; align-items: center; justify-content: center; padding: 0"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></button>
<button type="button" aria-label="Next month" style="width: 44px; height: 44px; border: none; background: transparent; color: #171717; display: flex; align-items: center; justify-content: center; padding: 0"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg></button>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 2px">
<sc-for list="{{weekdays}}" as="w" hint-placeholder-count="7">
<span style="height: 20px; text-align: center; font-size: 12px; font-weight: 500; color: #5C5C5C">{{w.name}}</span>
</sc-for>
<sc-for list="{{cells}}" as="c" hint-placeholder-count="42">
<button type="button" aria-label="{{c.aria}}" aria-pressed="{{c.pressed}}" style="height: 44px; border: {{c.border}}; border-radius: 12px; background: {{c.bg}}; color: {{c.ink}}; font-family: inherit; font-size: 15px; font-weight: {{c.weight}}; padding: 0; visibility: {{c.vis}}">{{c.num}}</button>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; border: 1px solid #E4E2DD; border-radius: 14px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 0 14px; border-bottom: 1px solid #EEECE8">
<label for="due-time" style="font-size: 15px; flex-grow: 1">Time</label>
<input id="due-time" type="time" value="10:00" style="height: 40px; border: 1px solid #D9D6D0; border-radius: 10px; background: #FFFFFF; font-family: inherit; font-size: 15px; color: #171717; padding: 0 8px">
</div>
<a href="RepeatReminder.dc.html" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 0 14px; text-decoration: none; color: #171717">
<span style="font-size: 15px">Repeat and reminders</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 14px; color: #5C5C5C">Never<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg></span>
</a>
</div>
<a href="Task.dc.html" style="height: 54px; border-radius: 14px; background: #D4213D; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Set for Mon 23 Nov</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var quick = [['Today', 'Sun'], ['Tomorrow', 'Mon'], ['This weekend', 'Sat'], ['Next week', '30 Nov']].map(function (q, i) {
var on = i === 1;
return { label: q[0], day: q[1], pressed: on ? 'true' : 'false', line: on ? '#171717' : '#D9D6D0', bg: on ? '#171717' : '#FFFFFF', ink: on ? '#FFFFFF' : '#171717' };
});
var weekdays = ['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'].map(function (n) { return { name: n }; });
var cells = [];
for (var i = 0; i < 42; i++) {
var day = i - 5;
var real = day >= 1 && day <= 30;
var selected = day === 23;
var today = day === 22;
cells.push({
num: real ? day : '',
aria: real ? day + ' November' : 'Empty',
pressed: selected ? 'true' : 'false',
vis: real ? 'visible' : 'hidden',
border: today ? '1px solid #171717' : 'none',
bg: selected ? '#171717' : 'transparent',
ink: selected ? '#FFFFFF' : '#171717',
weight: selected || today ? 600 : 400
});
}
return { quick: quick, weekdays: weekdays, cells: cells };
}
}
</script>
</body>
</html>
