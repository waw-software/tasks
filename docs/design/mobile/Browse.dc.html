<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Browse projects, labels and filters</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B01A31}a:hover{color:#8C1427}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; padding: 56px 0 20px; display: flex; flex-direction: column; background: #FFFFFF; color: #171717; font-family: Inter, system-ui, sans-serif">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 0 20px 12px">
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 30px; letter-spacing: -0.4px">Browse</h1>
<a href="Settings.dc.html" aria-label="Settings" style="width: 44px; height: 44px; border: 1px solid #E4E2DD; border-radius: 12px; color: #171717; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"></path><circle cx="16" cy="6" r="2"></circle><circle cx="10" cy="12" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg>
</a>
</div>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 14px; padding: 0 20px; overflow: hidden">
<div style="display: flex; align-items: center; gap: 8px; align-self: flex-start; padding: 8px 12px; border-radius: 999px; background: #F6F5F2">
<span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: #1F7A4D"></span>
<span style="font-size: 13px; font-weight: 500; color: #3D3D3D">home-server · synced</span>
</div>
<a href="Inbox.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 14px; border: 1px solid #E4E2DD; border-radius: 14px; text-decoration: none; color: #171717">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13l2-8h12l2 8v6H4z M4 13h5l1 2h4l1-2h5"></path></svg>
<span style="flex-grow: 1; font-size: 16px; font-weight: 600">Inbox</span>
<span style="font-size: 14px; color: #5C5C5C">3</span>
</a>
<div style="display: flex; flex-direction: column">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.4px; color: #5C5C5C">PROJECTS</span>
<sc-for list="{{projects}}" as="p" hint-placeholder-count="3">
<a href="Project.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 48px; border-bottom: 1px solid #EEECE8; text-decoration: none; color: #171717">
<span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 4px; background: {{p.color}}"></span>
<span style="flex-grow: 1; font-size: 16px">{{p.name}}</span>
<span style="font-size: 14px; color: #5C5C5C">{{p.count}}</span>
</a>
</sc-for>
<button type="button" style="align-self: flex-start; height: 44px; padding: 0; border: none; background: transparent; color: #B01A31; font-family: inherit; font-size: 15px; font-weight: 500">New project</button>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.4px; color: #5C5C5C">LABELS</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{labels}}" as="l" hint-placeholder-count="3">
<a href="Search.dc.html" style="padding: 12px 14px; border-radius: 10px; background: {{l.bg}}; font-size: 14px; font-weight: 500; color: {{l.ink}}; text-decoration: none">{{l.name}}</a>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.4px; color: #5C5C5C">FILTERS</span>
<sc-for list="{{filters}}" as="f" hint-placeholder-count="2">
<a href="Search.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 48px; border-bottom: 1px solid #EEECE8; text-decoration: none; color: #171717">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5C5C5C" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16l-6 8v6l-4-2v-4z"></path></svg>
<span style="flex-grow: 1; font-size: 16px">{{f.name}}</span>
<span style="font-size: 14px; color: #5C5C5C">{{f.count}}</span>
</a>
</sc-for>
</div>
</div>
<nav aria-label="Main" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 6px 12px 0; border-top: 1px solid #EEECE8">
<sc-for list="{{tabs}}" as="tab" hint-placeholder-count="4">
<a href="{{tab.href}}" style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: {{tab.ink}}; font-size: 11px; font-weight: {{tab.weight}}">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{tab.d}}"></path></svg>
<span>{{tab.label}}</span>
</a>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var tabs = [
['Today', 'Main.dc.html', 'M6 5h12a2 2 0 012 2v11a2 2 0 01-2 2H6a2 2 0 01-2-2V7a2 2 0 012-2z M4 10h16 M9 3v4 M15 3v4'],
['Upcoming', 'Upcoming.dc.html', 'M4 7h16 M4 12h16 M4 17h9'],
['Search', 'Search.dc.html', 'M11 4a7 7 0 100 14 7 7 0 000-14z M20 20l-4-4'],
['Browse', 'Browse.dc.html', 'M4 5h7v7H4z M13 5h7v7h-7z M4 14h7v5H4z M13 14h7v5h-7z']
].map(function (t) {
var on = t[0] === 'Browse';
return { label: t[0], href: t[1], d: t[2], ink: on ? '#D4213D' : '#5C5C5C', weight: on ? 600 : 500 };
});
return {
tabs: tabs,
projects: [{ name: 'Home', count: '5', color: '#D4213D' }, { name: 'Work', count: '9', color: '#1F5FBF' }, { name: 'Personal', count: '4', color: '#1F7A4D' }],
labels: [{ name: '@money', bg: '#EEF6F1', ink: '#1B6943' }, { name: '@calls', bg: '#EAF1FB', ink: '#1F5FBF' }, { name: '@waiting', bg: '#FBF3E2', ink: '#8A5A00' }, { name: '@errands', bg: '#F0ECFA', ink: '#5B3FB5' }],
filters: [{ name: 'Priority 1', count: '3' }, { name: 'This week at work', count: '5' }]
};
}
}
</script>
</body>
</html>
