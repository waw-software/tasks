<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Today, all done</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B01A31}a:hover{color:#8C1427}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; padding: 56px 0 20px; display: flex; flex-direction: column; background: #FFFFFF; color: #171717; font-family: Inter, system-ui, sans-serif">
<div style="display: flex; flex-direction: column; gap: 12px; padding: 0 20px 14px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 30px; letter-spacing: -0.4px">Today</h1>
<span style="font-size: 14px; color: #5C5C5C">Sun 22 Nov · all done</span>
</div>
<div style="display: flex; align-items: center; gap: 10px">
<div role="img" aria-label="7 of 7 tasks done" style="flex-grow: 1; height: 6px; border-radius: 3px; background: #1F7A4D"></div>
<span style="font-size: 13px; color: #1B6943">7 of 7 done</span>
</div>
</div>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 20px; padding: 16px 20px 0; overflow: hidden">
<div style="display: flex; flex-direction: column; gap: 12px; padding: 20px; border-radius: 18px; background: #EEF6F1">
<div aria-hidden="true" style="width: 48px; height: 48px; border-radius: 14px; background: #1F7A4D; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg>
</div>
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 22px; letter-spacing: -0.2px">Nothing left for today</h2>
<p style="margin: 0; font-size: 15px; line-height: 22px; color: #3D3D3D">You closed everything on the list. Tomorrow starts with two tasks.</p>
</div>
<div style="display: flex; flex-direction: column">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.4px; color: #5C5C5C">TOMORROW</span>
<sc-for list="{{tomorrow}}" as="t" hint-placeholder-count="2">
<a href="Task.dc.html" style="display: flex; flex-direction: column; gap: 3px; padding: 12px 0; border-bottom: 1px solid #EEECE8; text-decoration: none; color: #171717">
<span style="font-size: 16px; line-height: 22px">{{t.title}}</span>
<span style="font-size: 13px; color: #5C5C5C">{{t.meta}}</span>
</a>
</sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<a href="Upcoming.dc.html" style="height: 50px; border: 1px solid #171717; border-radius: 12px; color: #171717; font-size: 15px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Plan the week</a>
<button type="button" style="height: 50px; border: 1px solid #D9D6D0; border-radius: 12px; background: #FFFFFF; color: #171717; font-family: inherit; font-size: 15px; font-weight: 500">Show completed</button>
</div>
</div>
<a href="QuickAdd.dc.html" aria-label="Add task" style="position: absolute; right: 20px; bottom: 96px; width: 56px; height: 56px; border-radius: 18px; background: #D4213D; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
</a>
<nav aria-label="Main" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 6px 12px 0; border-top: 1px solid #EEECE8">
<sc-for list="{{tabs}}" as="tab" hint-placeholder-count="4">
<a href="{{tab.href}}" style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: {{tab.ink}}; font-size: 11px; font-weight: {{tab.weight}}">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{tab.d}}"></path></svg>
<span>{{tab.label}}</span>
</a>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var tabs = [
['Today', 'Main.dc.html', 'M6 5h12a2 2 0 012 2v11a2 2 0 01-2 2H6a2 2 0 01-2-2V7a2 2 0 012-2z M4 10h16 M9 3v4 M15 3v4'],
['Upcoming', 'Upcoming.dc.html', 'M4 7h16 M4 12h16 M4 17h9'],
['Search', 'Search.dc.html', 'M11 4a7 7 0 100 14 7 7 0 000-14z M20 20l-4-4'],
['Browse', 'Browse.dc.html', 'M4 5h7v7H4z M13 5h7v7h-7z M4 14h7v5H4z M13 14h7v5h-7z']
].map(function (t) {
var on = t[0] === 'Today';
return { label: t[0], href: t[1], d: t[2], ink: on ? '#D4213D' : '#5C5C5C', weight: on ? 600 : 500 };
});
return {
tabs: tabs,
tomorrow: [
{ title: 'Send the weekly report', meta: 'P2 · 10:00 · Work' },
{ title: 'Electricity bill', meta: 'Home' }
]
};
}
}
</script>
</body>
</html>
