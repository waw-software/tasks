<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>New filter</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B01A31}a:hover{color:#8C1427}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 56px 20px 28px; display: flex; flex-direction: column; gap: 16px; background: #FFFFFF; color: #171717; font-family: Inter, system-ui, sans-serif">
<div style="display: flex; align-items: center; gap: 6px; margin-left: -8px">
<a href="Browse.dc.html" aria-label="Back to browse" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #171717">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<h1 style="margin: 0; flex-grow: 1; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 24px; letter-spacing: -0.3px">New filter</h1>
<a href="Browse.dc.html" style="height: 44px; padding: 0 18px; border-radius: 12px; background: #D4213D; color: #FFFFFF; font-size: 15px; font-weight: 600; text-decoration: none; display: flex; align-items: center">Save</a>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="f-name" style="font-size: 13px; font-weight: 500; color: #5C5C5C">Name</label>
<input id="f-name" type="text" value="This week at work" style="height: 50px; box-sizing: border-box; padding: 0 16px; border: 1px solid #D9D6D0; border-radius: 12px; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #171717">
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.4px; color: #5C5C5C">SHOW TASKS WHERE</span>
<div style="display: flex; align-items: center; gap: 8px">
<label for="c1" style="width: 78px; flex-shrink: 0; font-size: 15px">Project is</label>
<select id="c1" style="flex-grow: 1; min-width: 0; height: 48px; padding: 0 10px; border: 1px solid #D9D6D0; border-radius: 12px; background: #FFFFFF; font-family: inherit; font-size: 15px; color: #171717"><option>Work</option><option>Home</option><option>Personal</option></select>
</div>
<div style="display: flex; align-items: center; gap: 8px">
<label for="c2" style="width: 78px; flex-shrink: 0; font-size: 15px">Due is</label>
<select id="c2" style="flex-grow: 1; min-width: 0; height: 48px; padding: 0 10px; border: 1px solid #D9D6D0; border-radius: 12px; background: #FFFFFF; font-family: inherit; font-size: 15px; color: #171717"><option>This week</option><option>Today</option><option>Overdue</option><option>No date</option></select>
</div>
<div style="display: flex; align-items: center; gap: 8px">
<label for="c3" style="width: 78px; flex-shrink: 0; font-size: 15px">Priority is</label>
<select id="c3" style="flex-grow: 1; min-width: 0; height: 48px; padding: 0 10px; border: 1px solid #D9D6D0; border-radius: 12px; background: #FFFFFF; font-family: inherit; font-size: 15px; color: #171717"><option>Any</option><option>Priority 1</option><option>Priority 1 or 2</option></select>
</div>
<button type="button" style="align-self: flex-start; height: 44px; padding: 0; border: none; background: transparent; color: #B01A31; font-family: inherit; font-size: 15px; font-weight: 500; display: flex; align-items: center; gap: 8px">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
<span>Add a condition</span>
</button>
</div>
<div style="display: flex; flex-direction: column">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.4px; color: #5C5C5C">MATCHES NOW · 5 TASKS</span>
<sc-for list="{{matches}}" as="m" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 3px; padding: 11px 0; border-bottom: 1px solid #EEECE8">
<span style="font-size: 15px; line-height: 21px">{{m.title}}</span>
<span style="font-size: 13px; color: #5C5C5C">{{m.meta}}</span>
</div>
</sc-for>
<span style="padding-top: 10px; font-size: 13px; color: #5C5C5C">and 2 more</span>
</div>
<div style="margin-top: auto; display: flex; gap: 10px; padding: 14px; border-radius: 12px; background: #F6F5F2">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#171717" stroke-width="1.8" stroke-linecap="round" style="flex-shrink: 0"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v5M12 8v.01"></path></svg>
<span style="font-size: 14px; line-height: 21px; color: #3D3D3D">Bots see saved filters too, so you can ask WAW Bot for this list by name.</span>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
return {
matches: [
{ title: 'Send the weekly report', meta: 'P2 · Mon 23 Nov, 10:00' },
{ title: 'Prepare the release notes', meta: 'P1 · Thu 26 Nov, 15:00' },
{ title: 'Review the pull request', meta: 'P2 · Today' }
]
};
}
}
</script>
</body>
</html>
