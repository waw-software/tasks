<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Project with sections</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B01A31}a:hover{color:#8C1427}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; padding: 56px 0 20px; display: flex; flex-direction: column; background: #FFFFFF; color: #171717; font-family: Inter, system-ui, sans-serif">
<div style="display: flex; flex-direction: column; gap: 12px; padding: 0 20px 10px">
<div style="display: flex; align-items: center; gap: 6px; margin-left: -8px">
<a href="Browse.dc.html" aria-label="Back to browse" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #171717">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg>
</a>
<span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 4px; background: #D4213D"></span>
<h1 style="margin: 0 0 0 4px; flex-grow: 1; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 26px; letter-spacing: -0.3px">Home</h1>
<span style="font-size: 14px; color: #5C5C5C">5 tasks</span>
<a href="EditProject.dc.html" aria-label="Edit project" style="width: 44px; height: 44px; margin-left: 8px; border: 1px solid #E4E2DD; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #171717">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"></path><path d="M13 7l4 4"></path></svg>
</a>
</div>
</div>
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px; padding: 0 20px 0 8px; overflow: hidden">
<sc-for list="{{sections}}" as="s" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column">
<div style="display: flex; align-items: center; justify-content: space-between; padding: 10px 0 4px 12px">
<span style="font-size: 15px; font-weight: 600">{{s.name}}</span>
<span style="font-size: 13px; color: #5C5C5C">{{s.count}}</span>
</div>
<sc-for list="{{s.tasks}}" as="t" hint-placeholder-count="2">
<div style="display: flex; align-items: flex-start; border-bottom: 1px solid #EEECE8">
<label style="width: 44px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center"><input type="checkbox" aria-label="{{t.title}}" style="width: 22px; height: 22px; accent-color: #171717"></label>
<a href="Task.dc.html" style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0; padding: 10px 0; text-decoration: none; color: #171717">
<span style="font-size: 16px; line-height: 22px">{{t.title}}</span>
<span style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-size: 13px; color: #5C5C5C"><span><span style="font-weight: 600; color: {{t.pInk}}">{{t.p}}</span><span>{{t.meta}}</span></span><sc-for list="{{t.labels}}" as="l" hint-placeholder-count="1"><span style="padding: 2px 8px; border-radius: 6px; background: {{l.bg}}; color: {{l.ink}}; font-weight: 500">{{l.name}}</span></sc-for></span>
</a>
</div>
</sc-for>
</div>
</sc-for>
<button type="button" style="margin: 12px 0 0 12px; height: 46px; border: 1px dashed #5C5C5C; border-radius: 12px; background: #FFFFFF; color: #171717; font-family: inherit; font-size: 15px; font-weight: 500">Add section</button>
</div>
<a href="QuickAdd.dc.html" aria-label="Add task" style="position: absolute; right: 20px; bottom: 96px; width: 56px; height: 56px; border-radius: 18px; background: #D4213D; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
</a>
<nav aria-label="Main" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); padding: 6px 12px 0; border-top: 1px solid #EEECE8">
<sc-for list="{{tabs}}" as="tab" hint-placeholder-count="4">
<a href="{{tab.href}}" style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: {{tab.ink}}; font-size: 11px; font-weight: {{tab.weight}}">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{tab.d}}"></path></svg>
<span>{{tab.label}}</span>
</a>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
var inks = { 1: '#B01A31', 2: '#8A5A00', 3: '#1F5FBF' };
var labelStyles = { money: ['#EEF6F1', '#1B6943'], calls: ['#EAF1FB', '#1F5FBF'], waiting: ['#FBF3E2', '#8A5A00'], errands: ['#F0ECFA', '#5B3FB5'] };
function task(title, pr, meta, labels) {
return { title: title, p: pr < 4 ? 'P' + pr + (meta ? ' · ' : '') : '', pInk: inks[pr] || '#5C5C5C', meta: meta, labels: (labels || []).map(function (n) { return { name: '@' + n, bg: labelStyles[n][0], ink: labelStyles[n][1] }; }) };
}
var tabs = [
['Today', 'Main.dc.html', 'M6 5h12a2 2 0 012 2v11a2 2 0 01-2 2H6a2 2 0 01-2-2V7a2 2 0 012-2z M4 10h16 M9 3v4 M15 3v4'],
['Upcoming', 'Upcoming.dc.html', 'M4 7h16 M4 12h16 M4 17h9'],
['Search', 'Search.dc.html', 'M11 4a7 7 0 100 14 7 7 0 000-14z M20 20l-4-4'],
['Browse', 'Browse.dc.html', 'M4 5h7v7H4z M13 5h7v7h-7z M4 14h7v5H4z M13 14h7v5h-7z']
].map(function (t) {
var on = t[0] === 'Browse';
return { label: t[0], href: t[1], d: t[2], ink: on ? '#D4213D' : '#5C5C5C', weight: on ? 600 : 500 };
});
var sections = [
{ name: 'Bills', count: '2', tasks: [task('Pay rent', 1, 'Today 09:00 · repeats monthly', ['money']), task('Electricity bill', 4, 'Mon 23 Nov', ['money'])] },
{ name: 'Repairs', count: '2', tasks: [task('Fix the kitchen tap', 2, 'No date', ['calls']), task('Order a new lamp', 4, 'No date', ['errands'])] },
{ name: 'No section', count: '1', tasks: [task('Buy milk', 4, 'Today 17:00', ['errands'])] }
];
return { tabs: tabs, sections: sections };
}
}
</script>
</body>
</html>
