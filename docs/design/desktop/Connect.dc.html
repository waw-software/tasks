<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Connect on desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B01A31}a:hover{color:#8C1427}
</style>
</helmet>
<div style="min-height: 900px; box-sizing: border-box; padding: 72px 32px; display: flex; justify-content: center; background: #FFFFFF; color: #171717; font-family: Inter, system-ui, sans-serif">
<div style="width: 100%; max-width: 1040px; display: flex; flex-wrap: wrap; gap: 48px 72px; align-items: flex-start">
<div style="flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 26px">
<div style="display: flex; align-items: center; gap: 10px">
<div aria-hidden="true" style="width: 36px; height: 36px; border-radius: 10px; background: #D4213D; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg></div>
<span style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 18px">WAW Tasks</span>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 38px; line-height: 44px; letter-spacing: -0.6px">Connect to your server</h1>
<p style="margin: 0; font-size: 17px; line-height: 26px; color: #5C5C5C">Your tasks live on a machine you control. Enter its address, or paste the pairing link from its setup page.</p>
</div>
<div style="display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="server-url" style="font-size: 13px; font-weight: 500; color: #5C5C5C">Server URL or pairing link</label>
<input id="server-url" type="url" value="https://tasks.example.com" style="height: 50px; box-sizing: border-box; padding: 0 16px; border: 1px solid #D9D6D0; border-radius: 12px; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #171717">
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<label for="access-token" style="font-size: 13px; font-weight: 500; color: #5C5C5C">Access token</label>
<input id="access-token" type="password" value="wawtasks-token" style="height: 50px; box-sizing: border-box; padding: 0 16px; border: 1px solid #D9D6D0; border-radius: 12px; background: #FFFFFF; font-family: inherit; font-size: 16px; color: #171717">
</div>
<div style="display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-radius: 12px; background: #EEF6F1">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1F7A4D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg>
<span style="font-size: 14px; font-weight: 500; color: #1B6943">Server reachable · API v1</span>
</div>
<a href="Main.dc.html" style="height: 52px; border-radius: 14px; background: #D4213D; color: #FFFFFF; font-size: 16px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Connect</a>
</div>
</div>
<div style="flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 18px; padding: 28px; border-radius: 20px; background: #F6F5F2">
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 20px">No server yet?</h2>
<sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
<div style="display: flex; gap: 14px">
<span aria-hidden="true" style="width: 28px; height: 28px; flex-shrink: 0; border-radius: 50%; background: #171717; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600">{{s.n}}</span>
<div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
<span style="font-size: 15px; font-weight: 600">{{s.title}}</span>
<span style="font-size: 14px; line-height: 21px; color: #3D3D3D">{{s.text}}</span>
</div>
</div>
</sc-for>
<div style="padding: 14px; border-radius: 12px; background: #171717; color: #FFFFFF; font-family: ui-monospace, Menlo, monospace; font-size: 13px; line-height: 20px; overflow-x: auto">docker compose up -d</div>
<a href="#deploy" style="align-self: flex-start; font-size: 15px; font-weight: 500; padding: 12px 0">Read the full deployment guide</a>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
renderVals() {
var steps = [
['Deploy the server', 'Download the compose file and start it on your machine, or deploy it from Coolify.'],
['Open its setup page', 'The server shows its address, a token and a pairing link.'],
['Paste them here', 'The phone app pairs by scanning the QR code on the same page.']
].map(function (s, i) { return { n: i + 1, title: s[0], text: s[1] }; });
return { steps: steps };
}
}
</script>
</body>
</html>
