<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Editing a task on desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B01A31}a:hover{color:#8C1427}
</style>
</helmet>
<div style="display: flex; flex-wrap: wrap; min-height: 1040px; background: #FFFFFF; color: #171717; font-family: Inter, system-ui, sans-serif">
<aside style="flex: 1 0 248px; box-sizing: border-box; padding: 20px 14px; display: flex; flex-direction: column; gap: 18px; background: #F6F5F2">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 6px">
<div aria-hidden="true" style="width: 30px; height: 30px; border-radius: 9px; background: #D4213D; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"></path></svg></div>
<span style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 17px">WAW Tasks</span>
</div>
<a href="QuickAdd.dc.html" style="height: 44px; border-radius: 12px; background: #D4213D; color: #FFFFFF; font-size: 15px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Add task</a>
<nav aria-label="Views" style="display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="3">
<a href="{{n.href}}" style="display: flex; align-items: center; justify-content: space-between; min-height: 44px; padding: 0 10px; border-radius: 10px; background: {{n.bg}}; color: #171717; font-size: 15px; font-weight: {{n.weight}}; text-decoration: none"><span>{{n.label}}</span><span style="font-size: 13px; color: #5C5C5C">{{n.count}}</span></a>
</sc-for>
</nav>
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="padding: 0 10px 4px; font-size: 12px; font-weight: 600; letter-spacing: 0.4px; color: #5C5C5C">PROJECTS</span>
<sc-for list="{{projects}}" as="p" hint-placeholder-count="3">
<a href="Project.dc.html" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 10px; border-radius: 10px; background: {{p.bg}}; color: #171717; font-size: 15px; font-weight: {{p.weight}}; text-decoration: none"><span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 3px; background: {{p.color}}"></span><span style="flex-grow: 1">{{p.name}}</span><span style="font-size: 13px; color: #5C5C5C">{{p.count}}</span></a>
</sc-for>
</div>
<a href="Settings.dc.html" style="margin-top: auto; display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 10px; border-radius: 10px; color: #3D3D3D; font-size: 13px; font-weight: 500; text-decoration: none"><span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: #1F7A4D"></span>home-server · synced</a>
</aside>
<main style="flex: 999 1 420px; min-width: 0; box-sizing: border-box; padding: 32px 36px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 30px; letter-spacing: -0.4px">Today</h1>
<span style="font-size: 14px; color: #5C5C5C">Sun 22 Nov · 5 tasks left</span>
</div>
<div style="display: flex; flex-direction: column">
<sc-for list="{{today}}" as="t" hint-placeholder-count="4">
<div style="display: flex; align-items: center; padding-right: 12px; border-bottom: 1px solid #EEECE8; border-radius: 10px; background: {{t.rowBg}}">
<label style="width: 44px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center"><input type="checkbox" aria-label="{{t.title}}" style="width: 20px; height: 20px; accent-color: #171717"></label>
<a href="Main.dc.html" style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; flex-grow: 1; min-width: 0; padding: 12px 0; text-decoration: none; color: #171717">
<span style="flex: 1 1 200px; min-width: 0; font-size: 15px">{{t.title}}</span>
<span style="font-size: 13px; color: #5C5C5C">{{t.meta}}</span>
</a>
</div>
</sc-for>
</div>
</main>
<aside aria-label="Edit task" style="flex: 1 1 380px; max-width: 440px; box-sizing: border-box; padding: 28px 28px 32px; border-left: 1px solid #EEECE8; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; align-items: center; justify-content: space-between">
<h2 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 22px; letter-spacing: -0.2px">Send the weekly report</h2>
<a href="Main.dc.html" aria-label="Close panel" style="width: 44px; height: 44px; color: #171717; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.4px; color: #5C5C5C">DUE DATE</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{quick}}" as="q" hint-placeholder-count="4">
<button type="button" aria-pressed="{{q.pressed}}" style="height: 44px; padding: 0 12px; border: 1px solid {{q.line}}; border-radius: 12px; background: {{q.bg}}; color: {{q.ink}}; font-family: inherit; font-size: 14px; font-weight: 500; display: flex; align-items: center; justify-content: space-between"><span>{{q.label}}</span><span style="opacity: 0.75">{{q.day}}</span></button>
</sc-for>
</div>
<div style="display: flex; align-items: center; justify-content: space-between">
<span style="font-size: 15px; font-weight: 600">November 2026</span>
<button type="button" style="height: 44px; padding: 0 4px; border: none; background: transparent; color: #5C5C5C; font-family: inherit; font-size: 14px; font-weight: 500">No date</button>
</div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); row-gap: 2px">
<sc-for list="{{weekdays}}" as="w" hint-placeholder-count="7">
<span style="height: 20px; text-align: center; font-size: 12px; font-weight: 500; color: #5C5C5C">{{w.name}}</span>
</sc-for>
<sc-for list="{{cells}}" as="c" hint-placeholder-count="36">
<button type="button" aria-label="{{c.aria}}" aria-pressed="{{c.pressed}}" style="height: 40px; border: {{c.border}}; border-radius: 10px; background: {{c.bg}}; color: {{c.ink}}; font-family: inherit; font-size: 14px; font-weight: {{c.weight}}; padding: 0; visibility: {{c.vis}}">{{c.num}}</button>
</sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 10px">
<div style="flex: 1 1 120px; display: flex; flex-direction: column; gap: 6px">
<label for="due-time" style="font-size: 13px; font-weight: 500; color: #5C5C5C">Time</label>
<input id="due-time" type="time" value="10:00" style="height: 44px; box-sizing: border-box; padding: 0 10px; border: 1px solid #D9D6D0; border-radius: 12px; background: #FFFFFF; font-family: inherit; font-size: 15px; color: #171717">
</div>
<div style="flex: 2 1 180px; display: flex; flex-direction: column; gap: 6px">
<label for="repeat" style="font-size: 13px; font-weight: 500; color: #5C5C5C">Repeat</label>
<select id="repeat" style="height: 44px; box-sizing: border-box; padding: 0 10px; border: 1px solid #D9D6D0; border-radius: 12px; background: #FFFFFF; font-family: inherit; font-size: 15px; color: #171717"><option>Every week on Monday</option><option>Never</option><option>Every day</option><option>Every month</option><option>Custom</option></select>
</div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.4px; color: #5C5C5C">PRIORITY</span>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{priorities}}" as="p" hint-placeholder-count="4">
<button type="button" aria-pressed="{{p.pressed}}" style="height: 44px; border: {{p.border}}; border-radius: 12px; background: {{p.bg}}; color: {{p.ink}}; font-family: inherit; font-size: 14px; font-weight: 600; padding: 0">{{p.label}}</button>
</sc-for>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.4px; color: #5C5C5C">LABELS</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{labels}}" as="l" hint-placeholder-count="4">
<button type="button" aria-pressed="{{l.pressed}}" style="height: 44px; padding: 0 12px; border: {{l.border}}; border-radius: 10px; background: {{l.bg}}; color: {{l.ink}}; font-family: inherit; font-size: 14px; font-weight: 500">{{l.name}}</button>
</sc-for>
</div>
</div>
<fieldset style="margin: 0; padding: 0; border: none; display: flex; flex-direction: column">
<legend style="padding: 0 0 6px; font-size: 12px; font-weight: 600; letter-spacing: 0.4px; color: #5C5C5C">REMIND ME</legend>
<sc-for list="{{reminders}}" as="m" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px; min-height: 44px">
<input id="{{m.id}}" type="checkbox" defaultChecked="{{m.on}}" style="width: 20px; height: 20px; flex-shrink: 0; accent-color: #171717">
<label for="{{m.id}}" style="font-size: 15px; flex-grow: 1; padding: 12px 0">{{m.label}}</label>
</div>
</sc-for>
</fieldset>
<a href="Main.dc.html" style="margin-top: auto; height: 46px; border-radius: 12px; background: #D4213D; color: #FFFFFF; font-size: 15px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center">Done</a>
</aside>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1040}}'>
class Component extends DCLogic {
renderVals() {
var on = function (k) { return k === 'Today'; };
var nav = [['Inbox', '3', 'Main.dc.html'], ['Today', '5', 'Main.dc.html'], ['Upcoming', '', 'Upcoming.dc.html']].map(function (n) { return { label: n[0], count: n[1], href: n[2], bg: on(n[0]) ? '#FFFFFF' : 'transparent', weight: on(n[0]) ? 600 : 500 }; });
var projects = [['Home', '5', '#D4213D'], ['Work', '9', '#1F5FBF'], ['Personal', '4', '#1F7A4D']].map(function (p) { return { name: p[0], count: p[1], color: p[2], bg: 'transparent', weight: 500 }; });
var today = [['Pay rent', 'P1 · 09:00 · Home', false], ['Send the weekly report', 'P2 · Tomorrow 10:00 · Work', true], ['Buy milk', '17:00 · Home', false], ['Call the dentist', 'Personal', false]].map(function (t) { return { title: t[0], meta: t[1], rowBg: t[2] ? '#F6F5F2' : 'transparent' }; });
var quick = [['Today', 'Sun'], ['Tomorrow', 'Mon'], ['This weekend', 'Sat'], ['Next week', '30 Nov']].map(function (q, i) {
var sel = i === 1;
return { label: q[0], day: q[1], pressed: sel ? 'true' : 'false', line: sel ? '#171717' : '#D9D6D0', bg: sel ? '#171717' : '#FFFFFF', ink: sel ? '#FFFFFF' : '#171717' };
});
var weekdays = ['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'].map(function (n) { return { name: n }; });
var cells = [];
for (var i = 0; i < 36; i++) {
var day = i - 5;
var real = day >= 1;
var selected = day === 23;
var isToday = day === 22;
cells.push({ num: real ? day : '', aria: real ? day + ' November' : 'Empty', pressed: selected ? 'true' : 'false', vis: real ? 'visible' : 'hidden', border: isToday ? '1px solid #171717' : 'none', bg: selected ? '#171717' : 'transparent', ink: selected ? '#FFFFFF' : '#171717', weight: selected || isToday ? 600 : 400 });
}
var pInks = ['#B01A31', '#8A5A00', '#1F5FBF', '#5C5C5C'];
var priorities = ['P1', 'P2', 'P3', 'P4'].map(function (label, i) {
var sel = i === 1;
return { label: label, pressed: sel ? 'true' : 'false', border: sel ? '2px solid #8A5A00' : '1px solid #D9D6D0', bg: sel ? '#FBF3E2' : '#FFFFFF', ink: pInks[i] };
});
var labels = [['@money', '#EEF6F1', '#1B6943', false], ['@calls', '#EAF1FB', '#1F5FBF', false], ['@waiting', '#FBF3E2', '#8A5A00', true], ['@errands', '#F0ECFA', '#5B3FB5', false]].map(function (l) {
return { name: l[0], bg: l[1], ink: l[2], pressed: l[3] ? 'true' : 'false', border: l[3] ? '2px solid ' + l[2] : '1px solid transparent' };
});
var reminders = ['At the time of the task', '10 minutes before', '1 day before'].map(function (label, i) { return { id: 'rem' + i, label: label, on: i === 0 }; });
return { nav: nav, projects: projects, today: today, quick: quick, weekdays: weekdays, cells: cells, priorities: priorities, labels: labels, reminders: reminders };
}
}
</script>
</body>
</html>
