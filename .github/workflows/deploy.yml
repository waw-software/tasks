# Drives docker-compose.yml with Docker: a fresh start with no configuration, and an update
# pulled from a disposable registry (packages/e2e/tests/deploy.spec.ts). The failure artifact
# holds the Playwright output.
name: deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: setup
        run: scripts/env.sh setup

      - name: deploy e2e
        run: scripts/project/pnpm.sh --filter @waw/e2e e2e:deploy

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-deploy
          path: packages/e2e/out/playwright/deploy
