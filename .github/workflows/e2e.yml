# Builds and starts the real server and a production web preview, then runs the Playwright
# end-to-end tests (scripts/env.sh e2e). The failure artifact holds the Playwright output.
name: e2e

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: setup
        run: scripts/env.sh setup

      - name: install chromium
        run: scripts/project/pnpm.sh --filter @waw/e2e exec playwright install --with-deps chromium

      - name: e2e
        run: scripts/env.sh e2e
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright
          path: packages/e2e/out/playwright
